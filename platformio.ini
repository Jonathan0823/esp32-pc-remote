[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 3670016
build_flags =
  -I.
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_PARTITION_esp_sr_16
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  knolleary/PubSubClient@2.8
extra_scripts = pre:pio_sr_models.py
monitor_speed = 115200
