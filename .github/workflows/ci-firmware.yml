name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Create config.h from template
        run: cp config.example.h config.h

      - name: Validate firmware
        run: make check-firmware

      - name: Build firmware and speech model image
        run: make build-firmware
